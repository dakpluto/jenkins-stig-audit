---
# A local run (inventory/local.yml) has inventory_hostname 'localhost'; name the
# reports after the machine instead.
- name: Set report host label
  ansible.builtin.set_fact:
    jsa_host_label: >-
      {{ ansible_fqdn if inventory_hostname in ['localhost', '127.0.0.1', '::1'] else inventory_hostname }}

- name: Set report paths
  ansible.builtin.set_fact:
    jsa_report_path: "{{ jenkins_stig_report_dir }}/{{ jsa_host_label }}"
    jsa_report_base: >-
      {{ jsa_host_label }}_jenkins_appsrv_srg_{{ ansible_date_time.date }}

- name: Parse the Application Server SRG XCCDF
  ansible.builtin.set_fact:
    jsa_xccdf: "{{ jenkins_stig_xccdf | stig_xccdf_rules }}"
  when: jenkins_stig_xccdf | length > 0

# Without an XCCDF, fall back to the bundled V-ID index (V4R5) so the HTML report
# still shows Vuln IDs. The .ckl needs the full XCCDF.
- name: Map checks to SRG Vuln IDs
  ansible.builtin.set_fact:
    jsa_srg_index: "{{ jsa_xccdf if jsa_xccdf is defined else _index }}"
    jsa_vuln_map: "{{ jsa_results | stig_vuln_map(jsa_xccdf if jsa_xccdf is defined else _index, jenkins_stig_rule_map) }}"
  vars:
    _index: "{{ lookup('ansible.builtin.file', role_path ~ '/files/app_server_srg_index.json') | from_json }}"

- name: Write reports
  delegate_to: localhost
  become: false
  block:
    - name: Create the report directory
      ansible.builtin.file:
        path: "{{ jsa_report_path }}"
        state: directory
        mode: "0750"

    - name: Write JSON results
      ansible.builtin.copy:
        dest: "{{ jsa_report_path }}/{{ jsa_report_base }}.json"
        mode: "0640"
        content: >-
          {{ {'host': jsa_evidence.host, 'collected_at': jsa_evidence.collected_at,
              'jenkins': {'version': jsa_evidence.rpm_version, 'home': jsa_home, 'running': jsa_evidence.running},
              'summary': jsa_summary, 'results': jsa_results,
              'srg_binding': (jsa_results | stig_bind(jsa_xccdf, jenkins_stig_rule_map)) if jsa_xccdf is defined else None}
             | to_nice_json(indent=2) }}

    - name: Write raw evidence
      ansible.builtin.copy:
        dest: "{{ jsa_report_path }}/{{ jsa_report_base }}_evidence.json"
        mode: "0640"
        content: "{{ jsa_evidence | to_nice_json(indent=2) }}"
      when: jenkins_stig_save_raw_evidence | bool

    - name: Write CSV results
      ansible.builtin.copy:
        dest: "{{ jsa_report_path }}/{{ jsa_report_base }}.csv"
        mode: "0640"
        content: "{{ jsa_results | stig_csv }}"

    - name: Write HTML report
      ansible.builtin.template:
        src: report.html.j2
        dest: "{{ jsa_report_path }}/{{ jsa_report_base }}.html"
        mode: "0640"

    - name: Write STIG Viewer checklist
      vars:
        _asset: >-
          {{ jenkins_stig_asset | combine({
               'host_name': ansible_hostname, 'host_fqdn': ansible_fqdn,
               'host_ip': jsa_evidence.host.ip, 'host_mac': jsa_evidence.host.mac,
               'collected_at': jsa_evidence.collected_at}) }}
      ansible.builtin.copy:
        dest: "{{ jsa_report_path }}/{{ jsa_report_base }}.ckl"
        mode: "0640"
        content: "{{ jsa_results | stig_ckl(jsa_xccdf, _asset, jenkins_stig_rule_map) }}"
      when: jsa_xccdf is defined

- name: Show summary
  ansible.builtin.debug:
    msg:
      - "Open: {{ jsa_summary.by_status.Open }} (CAT I {{ jsa_summary.open_by_severity.high }},
         CAT II {{ jsa_summary.open_by_severity.medium }}, CAT III {{ jsa_summary.open_by_severity.low }})"
      - "NotAFinding: {{ jsa_summary.by_status.NotAFinding }}  Not_Reviewed: {{ jsa_summary.by_status.Not_Reviewed }}
         Not_Applicable: {{ jsa_summary.by_status.Not_Applicable }}"
      - "Open checks: {{ jsa_results | selectattr('status', 'eq', 'Open') | map(attribute='id') | join(', ') }}"
      - "Reports: {{ jsa_report_path }}/{{ jsa_report_base }}.*"

- name: Fail on Open findings of the configured severities
  ansible.builtin.fail:
    msg: >-
      Open findings at severity {{ jenkins_stig_fail_on | join('/') }}:
      {{ jsa_results | selectattr('status', 'eq', 'Open') | selectattr('severity', 'in', jenkins_stig_fail_on)
         | map(attribute='id') | join(', ') }}
  when: >-
    jenkins_stig_fail_on | length > 0 and
    (jsa_results | selectattr('status', 'eq', 'Open') | selectattr('severity', 'in', jenkins_stig_fail_on) | list | length) > 0
