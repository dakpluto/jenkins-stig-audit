---
# Site-specific values for the audit. See roles/jenkins_stig_audit/defaults/main.yml
# for every option and its default.

# DISA Application Server SRG XCCDF (.zip from cyber.mil or the extracted .xml).
# When set, a STIG Viewer .ckl is written next to the other reports.
jenkins_stig_xccdf: ""   # "{{ playbook_dir }}/stig/U_Application_Server_SRG_V#R#_Manual.zip"

# Public URL when a reverse proxy terminates TLS (probes then test what users see).
jenkins_audit_url: ""
jenkins_stig_tls_termination: auto

jenkins_stig_max_session_timeout: 15
jenkins_stig_approved_ports: []
jenkins_stig_approved_plugins: []
jenkins_stig_prohibited_plugins: []

# Air-gapped sites: download https://updates.jenkins.io/update-center.actual.json
# to the controller and point at it so plugin/core advisories can be evaluated.
jenkins_stig_update_center_file: ""

# Documented mitigations / manual results.
jenkins_stig_overrides: {}
#  JNKS-009:
#    status: Open
#    comment: "No native control; accepted in POA&M item 42"
