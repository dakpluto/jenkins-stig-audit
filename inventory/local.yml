---
# Run an audit on the server itself, with no SSH and no separate Ansible
# controller. Use with: ./run_local.sh [jenkins|gitlab|nexus|postgres]  (or -i inventory/local.yml).
# Modules run under the same Python as ansible-playbook, so the RHEL 8
# platform-python 3.6 limitation of ansible-core 2.17+ does not apply here.
# localhost is in every group; each playbook only targets its own group, and a
# playbook whose product is not installed skips the host.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    jenkins:
      hosts:
        localhost:
    gitlab:
      hosts:
        localhost:
    nexus:
      hosts:
        localhost:
    postgres:
      hosts:
        localhost:
